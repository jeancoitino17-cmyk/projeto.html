<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Capitão Ganso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Estou aprendendo CSS</h1>
    <h2>Spoilers de CSS e outras coisas...</h2>
    <hr>

    <div class="linha">
        <button onclick="calcularParImpar()">Par ou Ímpar</button>
        <output id="resultado_par_impar"></output>
    </div>

    <div class="linha">
        <button onclick="mostrarDiaDaSemana()">Mostrar Dia da Semana</button>
        <output id="resultado"></output> 
    </div>

    <div class="linha">
        <button onclick="revelarRecreio()">Revelar Recreio</button>
        <output id="resultado_recreio"></output>
    </div>

    <div class="linha">
        <button onclick="verificarMeta()">D. Bete - Meta</button>
        <output id="resultado_meta"></output>
    </div>

    <div class="linha">
        <button onclick="verificarCreditoAvalon()">Abrir Linha de Crédito</button>
        <output id="resultado_credito"></output>
    </div>

    <div class="linha">
        <button onclick="calcularPrecoVenda()">Romero Brique</button>
        <output id="resultado_venda"></output>
    </div>

    <div class="linha">
        <button onclick="controleProvisoes()">Calcular Previsões</button>
        <output id="resultado_provisoes"></output>
    </div>

    <div class="linha">
        <button onclick="recrutarMarujo()">Recrutamento de Marujos</button>
        <output id="resultado_marujos"></output>
    </div>

    <div class="linha">
        <button onclick="verificarFumaca()">Quantidade de Crianças</button>
        <output id="maquina de fumaça"></output>
    </div>

    <div class="linha">
        <button onclick="verificarDeslocamento()">Verificar Deslocamento</button>
        <output id="viagem"></output>
    </div>

    <div class="linha">
        <button onclick="verificarEntradaPalco()">Verificar Entrada no Palco</button>
        <output id="palco"></output>
    </div>

    <div class="linha">
        <button onclick="verificarTransporte()">Verificar Transporte</button>
        <output id="transporte"></output>
    </div>

    <div class="linha">
        <button onclick="acessarCentroComando()">Acessar Centro de Comando</button>
        <output id="centro_comando"></output>
    </div>

    <div class="linha">
        <button onclick="controlarJaulas()">Controlar Jaulas</button>
        <output id="jaulas"></output>
    </div>

    <script src="./capitao ganso.js"></script>
</body>
</html>
